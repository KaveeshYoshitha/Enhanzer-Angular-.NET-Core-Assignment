<div style="max-width: 800px; margin: 0 auto; padding: 20px; font-family: 'Segoe UI', Tahoma">
  <h1 style="text-align: center">Book Manager</h1>

  <div style="border: 1px solid #ccc; padding: 20px 30px; border-radius: 5px; margin-bottom: 20px">
    <h2>{{ isEditing ? 'Edit Book' : 'Add New Book' }}</h2>

    <form (ngSubmit)="onSubmit()" #bookForm="ngForm">
      <div style="margin-bottom: 10px">
        <label style="display: block">Title:</label>
        <input
          type="text"
          name="title"
          [(ngModel)]="currentBook.title"
          required
          style="width: 100%; padding: 8px"
        />
      </div>

      <div style="margin-bottom: 10px">
        <label style="display: block">Author:</label>
        <input
          type="text"
          name="author"
          [(ngModel)]="currentBook.author"
          required
          style="width: 100%; padding: 8px"
        />
      </div>

      <div style="margin-bottom: 10px">
        <label style="display: block">ISBN:</label>
        <input
          type="text"
          name="isbn"
          [(ngModel)]="currentBook.isbn"
          required
          style="width: 100%; padding: 8px"
        />
      </div>

      <div style="margin-bottom: 15px">
        <label style="display: block">Publication Date:</label>
        <input
          type="date"
          name="publicationDate"
          [(ngModel)]="currentBook.publicationDate"
          required
          style="width: 100%; padding: 8px"
        />
      </div>

      <button
        type="button"
        (click)="resetForm()"
        style="padding: 10px 15px; background: #6c757d; color: white; border: none; cursor: pointer"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="!bookForm.form.valid"
        style="
          padding: 10px 15px;
          background: #007bff;
          color: white;
          border: none;
          cursor: pointer;
          margin-left: 10px;
        "
      >
        {{ isEditing ? 'Update Book' : 'Save Book' }}
      </button>
    </form>
  </div>

  <h2>Book List</h2>
  <table style="width: 100%; border-collapse: collapse">
    <thead>
      <tr style="background: #f8f9fa; border-bottom: 2px solid #dee2e6">
        <th style="padding: 10px; text-align: left">Title</th>
        <th style="padding: 10px; text-align: left">Author</th>
        <th style="padding: 10px; text-align: left">ISBN</th>
        <th style="padding: 10px; text-align: left">Published</th>
        <th style="padding: 10px; text-align: left">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let book of books" style="border-bottom: 1px solid #dee2e6">
        <td style="padding: 10px">{{ book.title }}</td>
        <td style="padding: 10px">{{ book.author }}</td>
        <td style="padding: 10px">{{ book.isbn }}</td>
        <td style="padding: 10px">{{ book.publicationDate | date: 'mediumDate' }}</td>
        <td style="padding: 10px">
          <button
            (click)="editBook(book)"
            style="
              background: #ffc107;
              border: none;
              padding: 5px 10px;
              cursor: pointer;
              margin-right: 5px;
            "
          >
            Edit
          </button>
          <button
            (click)="deleteBook(book.id)"
            style="
              background: #dc3545;
              color: white;
              border: none;
              padding: 5px 10px;
              cursor: pointer;
            "
          >
            Delete
          </button>
        </td>
      </tr>
      <tr *ngIf="books.length === 0">
        <td colspan="5" style="padding: 20px; text-align: center; color: #6c757d">
          No books found. Add one above!
        </td>
      </tr>
    </tbody>
  </table>
</div>
